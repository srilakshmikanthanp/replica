spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.url=jdbc:h2:file:./data/${playground.station-name}
spring.datasource.username=sa
spring.datasource.password=
spring.task.scheduling.pool.size=4
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# master changes data and queues every change for the stations; slave only receives and applies what its master sends
playground.role=master
# this instance's name, sent with every batch and used for its H2 file
playground.station-name=master

# pause between automatic publishing runs, and rows per batch
playground.interval-ms=1000
playground.batch-size=50

# origins the web app may call from (comma separated, * for any)
playground.cors-origins=*
