spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.url=jdbc:h2:file:./data/${playground.station-name}
spring.datasource.username=sa
spring.datasource.password=
spring.task.scheduling.pool.size=4
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.config.import=optional:file:./.env[.properties]
playground.station-name=${playground.master-name:master}
playground.role=master
# pause between automatic publishing runs, and rows per batch
playground.interval-ms=1000
playground.batch-size=50
# origins the web app may call from (comma separated, * for any)
playground.cors-origins=*
